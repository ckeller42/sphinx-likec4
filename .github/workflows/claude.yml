# Claude Code in interactive mode: answers "@claude …" in issue and PR comments and can push
# commits. Authenticates with the maintainer's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN,
# created with `claude setup-token`), so runs draw on that plan, not API billing.
# See https://code.claude.com/docs/en/github-actions
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
permissions: { contents: read }
jobs:
  claude:
    # only start a runner when the trigger phrase is present (the action re-checks it)
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write          # the action's default GitHub App authentication
      actions: read            # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 30"
