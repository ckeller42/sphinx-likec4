name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: the floor and the deploy target, plus the Sphinx bounds
          - { os: ubuntu-latest, python: "3.10", sphinx: "sphinx>=7,<8" }
          - { os: ubuntu-latest, python: "3.13", sphinx: "sphinx>=8,<9" }
          - { os: ubuntu-latest, python: "3.13", sphinx: "" }
          # one smoke cell per other platform: npx resolution, path handling, Chromium install
          - { os: macos-latest,   python: "3.13", sphinx: "" }
          - { os: windows-latest, python: "3.13", sphinx: "" }
    defaults:
      run: { shell: bash }              # the same step syntax on every runner (Windows defaults to pwsh)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e .[test]
      - run: if [ -n "${{ matrix.sphinx }}" ]; then pip install "${{ matrix.sphinx }}"; fi
      - run: python -m pytest src/ tests/ -q
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.sphinx == ''
        run: python -m ruff check .
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e .[docs]
      - name: Install TeX Live (PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-xetex fonts-freefont-otf
      - run: python -m sphinx -b html -W docs docs/_build/html
      - name: Build PDF
        run: python -m sphinx -M latexpdf docs docs/_build -W
      - uses: actions/upload-artifact@v7        # reviewable on PRs before it reaches Pages
        with: { name: sphinx-likec4.pdf, path: docs/_build/latex/sphinx-likec4.pdf }
      - run: cp docs/_build/latex/sphinx-likec4.pdf docs/_build/html/
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with: { path: docs/_build/html }
  docs-deploy:
    if: github.ref == 'refs/heads/main'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages }
    # Pages rejects a deployment while another is in progress (HTTP 400); back-to-back
    # merges to main otherwise race and fail. Queue, never cancel a deploy mid-flight.
    concurrency: { group: pages, cancel-in-progress: false }
    steps:
      - uses: actions/deploy-pages@v5
