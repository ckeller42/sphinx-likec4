name: Release
on:
  push: { branches: [main] }
  workflow_dispatch:      # dependabot-auto-merge.yml dispatches this after a GITHUB_TOKEN merge (no push event)
permissions: { contents: read }

# One release run at a time; never cancel one mid-publish.
concurrency: { group: release, cancel-in-progress: false }

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Keeps one Release PR open (version bump + changelog from conventional commits);
      # merging it tags vX.Y.Z and creates the GitHub Release, then the jobs below run.
      # Publishing lives in this workflow because a tag made with GITHUB_TOKEN
      # would not trigger a separate tag-triggered workflow.
      - id: rp
        uses: googleapis/release-please-action@v4
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.release-please.outputs.tag_name }}" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # name must match the PyPI trusted-publisher config
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
