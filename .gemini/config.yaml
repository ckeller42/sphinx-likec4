# Gemini Code Assist on GitHub — picked up once the app is installed on the repo.
# https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
have_fun: false
code_review:
  disable: false
  comment_severity_threshold: MEDIUM   # CodeRabbit and Claude already cover the nits
  max_review_comments: 10
  pull_request_opened:
    help: false
    summary: false                     # CodeRabbit posts the walkthrough
    code_review: true
    include_drafts: false
ignore_patterns:
  - "docs/_build/**"
  - "docs/plans/**"
  - "docs/specs/**"
